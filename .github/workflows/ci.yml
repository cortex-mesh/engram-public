name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

env:
  NEXT_TELEMETRY_DISABLED: "1"
  NPM_CONFIG_UPDATE_NOTIFIER: "false"
  NPM_CONFIG_FUND: "false"

jobs:
  changes:
    name: Detect changed areas
    # GitHub-hosted runner. This public repo must not target the self-hosted
    # macOS pool: fork PR code would execute on the fleet.
    runs-on: ubuntu-latest
    outputs:
      infra_cdk: ${{ steps.filter.outputs.infra_cdk }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Detect infra changes
        id: filter
        uses: dorny/paths-filter@v4.0.1
        with:
          filters: |
            infra_cdk:
              - 'infra/cdk/**'

  app:
    name: Lint, Test, Build
    needs: changes
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: engram_test
          POSTGRES_PASSWORD: engram_test
          POSTGRES_DB: engram_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U engram_test -d engram_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install app dependencies
        run: npm ci --ignore-scripts --no-audit

      - name: Audit app dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: TypeScript check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:ci

      # 127.0.0.1, not localhost: tests/integration/setup.ts rejects any DATABASE_URL containing "localhost".
      - name: Reset integration test database
        env:
          PGPASSWORD: engram_test
        run: |
          # Wipe and recreate the public schema so each CI run starts from a
          # known-good state. engram_test is a dedicated test database owned
          # by the engram_test user; destructive ops here are safe.
          psql -U engram_test -h 127.0.0.1 -d engram_test -c "DROP SCHEMA public CASCADE; CREATE SCHEMA public;"
          for m in prisma/migrations/*/migration.sql; do
            echo "Applying $m"
            psql -U engram_test -h 127.0.0.1 -d engram_test -f "$m"
          done

      - name: Integration tests
        env:
          DATABASE_URL: postgresql://engram_test:engram_test@127.0.0.1:5432/engram_test
        run: npm run test:integration

      - name: Build
        run: npm run build

  infra_cdk:
    name: Infra CDK
    needs: changes
    if: ${{ needs.changes.outputs.infra_cdk == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/cdk

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infra/cdk/package-lock.json

      - name: Install infra dependencies
        run: npm ci

      - name: Infra TypeScript check
        run: npm run typecheck

      - name: Infra tests
        run: npm test

      - name: Infra build
        run: npm run build

      - name: Infra synth
        env:
          AWS_REGION: us-west-2
          HOSTED_ZONE_ID: ZTEST123456
        run: npm run cdk:synth

  adr-check:
    name: ADR number check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check ADR numbers are strictly monotonic (ADR-128)
        run: bash scripts/check-adr-numbers.sh check

  migration-guard:
    name: Migration guard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Block migration PRs without human approval (ADR-128)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash scripts/migration-guard.sh
